<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>TourismWebsite</title>
</head>
<body>
    <header>
        <div class="header-container">
            <video autoplay muted loop playsinline preload="auto" class="background-video">
                <source src="assets/brunei_cinematic_video.mp4" type="video/mp4">
            </video>
            <div class= "header-content">
                <h1 class="title">BRUNEI</h1>
                <p class="title-desc"><b>abode of peace</b></p>
            </div>
            <div class="nav-content">
                <nav>
                    <ul>
                        <li><a href="index.html">HOME</a></li>
                        <li><a href="event.html">EVENTS</a></li>
                        <li><a href="locations.html">ATTRACTIONS</a></li>
                        <li><a href="contact.html">ABOUT US</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section id="welcome1">
            <h2 id="discover">DISCOVER BRUNEI 2027</h2>
            <p id="abode"><b>Welcome to the abode of peace.</b></p>
        </section>
        <section id="card-row">
            <div class="card2" id="card2-1"
                 data-title="Explore Brunei"
                 data-info="Discover top attractions, culture, and hidden gems across the country."
                 data-link="locations.html">
                <div class="card-bg"></div>
                <div class="card-content">
                    <h1>Explore</h1>
                </div>
            </div>
            <div class="card2" id="card2-2"
                 data-title="Places To Go"
                 data-info="Must-visit spots, landmarks, and scenic routes for your trip."
                 data-link="locations.html">
                <div class="card-bg"></div>
                <div class="card-content">
                    <h1>To Go</h1>
                </div>
            </div>
            <div class="card2" id="card2-3"
                 data-title="To Eat"
                 data-info="Local dishes and food spots you should not miss."
                 data-link="locations.html">
                <div class="card-bg"></div>
                <div class="card-content">
                    <h1>To Eat</h1>
                </div>
            </div>
            <div class="card2" id="card2-4"
                 data-title="To Contact"
                 data-info="Get in touch with us for questions and inquiries."
                 data-link="contact.html">
                <div class="card-bg"></div>
                <div class="card-content">
                    <h1>To Contact</h1>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <p id="trademark">&copy; MOT 2026</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
